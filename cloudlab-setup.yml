---
- name: Configure JupyterLab and OpenCode
  hosts: all
  become: true
  tasks:
    - name: Write CloudLab-generated service credentials
      ansible.builtin.copy:
        dest: /local/repository/.env
        content: |
          JUPYTER_PORT=8888
          OPENCODE_PORT=4096
          BIND_ADDRESS=0.0.0.0
          JUPYTER_DATA_DIR={{ data_root }}/jupyter-data
          OPENCODE_PROJECT_DIR=project
          JUPYTER_TOKEN={{ jupyter_token }}
          OPENCODE_SERVER_USERNAME=opencode
          OPENCODE_SERVER_PASSWORD={{ opencode_password }}
        owner: root
        group: root
        mode: "0600"

    - name: Install and start the services
      ansible.builtin.command:
        argv:
          - /bin/bash
          - /local/repository/setup.sh
          - "{{ data_root }}"
